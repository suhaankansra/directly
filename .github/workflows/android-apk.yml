name: Android release APK

# Every push builds the installable APK, so a change can be tried on a phone
# without a local Android toolchain.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older build pointless; keep only the latest per ref.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Four ABIs of native code from a cold cache is the slow part.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `version` is read from the root package.json's packageManager field, so
      # CI uses the same pnpm as the lockfiles were written with.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # apps/ios is not a pnpm workspace member, so it keeps its own lockfile and
      # gets its own install below.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared core
        run: pnpm build:core

      - name: Install app dependencies
        working-directory: apps/ios
        run: pnpm install --frozen-lockfile

      # The native project is gitignored build output, so CI regenerates it. The
      # injection script has to be rebuilt first: it reads the core's dist.
      - name: Generate the injected script and native project
        working-directory: apps/ios
        run: |
          pnpm prebuild
          npx expo prebuild --platform android --no-install

      # Gradle will fetch the NDK itself, but accepting the licences up front and
      # installing the versions React Native 0.88 asks for avoids a mid-build
      # download failing the job.
      - name: Install Android NDK and CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1"

      # `cache: gradle` on setup-java cannot work here: it hashes committed Gradle
      # files, and every one of them lives in the gitignored android/ directory
      # that the step above only just generated.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/ios/pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # All four ABIs, because the artifact is meant to be sideloaded onto any
      # phone. Drop to -PreactNativeArchitectures=arm64-v8a for a faster job that
      # only covers modern devices and the emulator.
      - name: Build the release APK
        working-directory: apps/ios/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: directly-release-apk
          path: apps/ios/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
