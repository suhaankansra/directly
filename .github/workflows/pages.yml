name: Website

# Publishes apps/web/dist to GitHub Pages. This is what gives the app stores a
# privacy-policy URL: https://suhaankansra.github.io/directly/privacy.html
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tools/make-icons.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push makes an older deploy pointless; keep only the latest per ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # `version` comes from the root package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site is static HTML/CSS/JS: the "build" is a copy, so no install.
      - name: Build the site
        run: pnpm build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
